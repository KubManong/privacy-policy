  <!-- 首帧主题引导：在样式表渲染前设置 data-theme，避免夜间或手动暗色用户先看到浅色闪烁。
       判定规则与 main.js 保持一致（时间自动 / 手动锁定 / ?theme= 预览）；无 JS 时保持默认浅色 -->
  <script>
    (function () {
      "use strict";
      try {
        var v = localStorage.getItem("qt-theme");
        var mode = (v === "auto" || v === "light" || v === "dark") ? v : "auto";
        var h = new Date().getHours();
        var theme = mode === "auto" ? (h >= 6 && h < 18 ? "light" : "dark") : mode;
        var q = location.search.match(/[?&]theme=(dark|light)/);
        if (q) theme = q[1];
        document.documentElement.setAttribute("data-theme", theme);
        var mc = document.querySelector('meta[name="theme-color"]');
        if (mc) mc.setAttribute("content", theme === "dark" ? "#161618" : "#f7f7f8");
      } catch (e) { /* localStorage 不可用：保持默认浅色 */ }
    })();
  </script>
